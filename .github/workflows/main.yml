name: Spring Boot CI

# Trigger workflow when code is pushed or pull request is created on main branch
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    # Get source code from repository
    - name: Checkout Code
      uses: actions/checkout@v4


    # Install Java
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven


    # Build Spring Boot Application
  - name: Build with Maven
  run: mvn clean install -DskipTests


    # Run Test Cases
    - name: Run Tests
      run: mvn test
